global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "revsplit-fastapi"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fastapi_service:8000"]

  - job_name: "revsplit-nodejs"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nodejs_webhook_ingester:3000"]
